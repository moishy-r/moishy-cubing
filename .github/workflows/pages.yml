name: Deploy site

# Builds and deploys cubing.moishy.dev from `docs/`.
#
# The demo bundle used to be a committed build artifact, which meant the site
# could silently go stale: change solver code, forget `deno task bundle`, and the
# live page kept running the old solver. That happened once and went unnoticed
# until someone checked. Guarding it in CI proved unreliable — `deno bundle`
# output shifts between Deno versions, so a rebuild-and-diff check failed
# spuriously, and "packages changed but the bundle didn't" false-positives on
# comment-only edits (minification strips them, so the bundle legitimately does
# not change).
#
# Building here removes the failure mode instead of policing it: the deployed
# bundle is compiled from whatever is on `main` at deploy time, so it cannot
# disagree with the source. Both `docs/apb-demo/apb.bundle.js` and
# `docs/cfop-demo/cfop.bundle.js` are gitignored.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build the demo bundles
        run: deno task bundle

      - name: Fail if a demo bundle is missing or implausibly small
        run: |
          set -euo pipefail
          # Real bundles are ~440KB (apb) and ~320KB (cfop). Anything tiny means the
          # build silently produced a stub, which would deploy a broken page.
          for f in docs/apb-demo/apb.bundle.js docs/cfop-demo/cfop.bundle.js; do
            test -f "$f" || { echo "::error::$f was not produced"; exit 1; }
            size=$(wc -c < "$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 100000 ]; then
              echo "::error::$f is only $size bytes — refusing to deploy"
              exit 1
            fi
          done

      - name: Fail if the CROP assets were not copied
        run: |
          set -euo pipefail
          # Same failure mode the apb guard above exists to prevent. crop/core/
          # is the single source of truth and every copy is gitignored, so if
          # `bundle:crop` silently no-ops the page deploys with a 404 for its
          # core and a dead timer — with nothing else failing.
          for f in docs/crop/crop-core.js docs/crop/crop-overlay.css docs/crop/icons/icon48.png; do
            test -s "$f" || { echo "::error::$f is missing or empty — refusing to deploy"; exit 1; }
          done
          # Byte-identical to the source, or the copy step is not doing its job.
          for pair in "crop/core/crop-core.js docs/crop/crop-core.js" \
                      "crop/core/crop-overlay.css docs/crop/crop-overlay.css"; do
            cmp -s $pair || { echo "::error::$pair differ — bundle:crop did not run"; exit 1; }
          done
          echo "crop assets: $(wc -c < docs/crop/crop-core.js) bytes of core, icons present"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
