name: Release

# Publishes workspace packages to JSR and npm. No secrets: both registries
# authenticate this workflow over OIDC.
#
# Two ways to trigger:
#   1. Push a tag `<package-dir>-v<version>`, e.g. `cubing-core-v0.1.0`. The tag's
#      version must match that package's deno.json, or the run fails before publishing.
#   2. Run manually from the Actions tab, choosing a package — or `all`, which
#      publishes every package in dependency order at whatever version its
#      deno.json declares. `all` is the one to use for a coordinated release.
#
# JSR and npm are separate jobs on purpose. npm runs only after JSR succeeds, so a
# problem on the npm side leaves a completed JSR release rather than a half-done
# one, and you can re-run just the failed job.
#
# Registry setup, both one-time:
#   JSR — link each package to this GitHub repository in its JSR settings.
#   npm — add this repository + the workflow filename `release.yml` as a trusted
#         publisher on each package. npm requires a package to already exist
#         before a trusted publisher can be attached to it, so the very first
#         version of a new package must be published manually; see the README.

on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        required: true
        type: choice
        default: all
        options: [all, cubing-core, algsets, apb]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Dependency order matters in both registries: algsets and apb declare
  # `@moishy/cubing-core@^x.y.z`, and a registry will reject a package whose
  # dependencies do not resolve.
  targets:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.resolve.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.package }}" in
              all) PACKAGES="cubing-core algsets apb" ;;
              *)   PACKAGES="${{ inputs.package }}" ;;
            esac
          else
            TAG="${GITHUB_REF_NAME}"
            PACKAGES="${TAG%-v*}"      # cubing-core-v0.1.0 -> cubing-core
            TAG_VERSION="${TAG##*-v}"  # cubing-core-v0.1.0 -> 0.1.0
            if [ ! -d "packages/$PACKAGES" ]; then
              echo "::error::Tag '$TAG' does not name a package directory under packages/"
              exit 1
            fi
            # A tag that disagrees with the manifest would publish a version nobody
            # can find from the tag. Fail before anything reaches a registry.
            MANIFEST=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('packages/$PACKAGES/deno.json')).version)")
            if [ "$MANIFEST" != "$TAG_VERSION" ]; then
              echo "::error::Tag says $TAG_VERSION but packages/$PACKAGES/deno.json says $MANIFEST"
              exit 1
            fi
          fi
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "Publishing: $PACKAGES"

  jsr:
    needs: targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # JSR OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Never publish something that does not pass the gate. This also runs the
      # version-consistency test, which checks each package's exported VERSION
      # against its deno.json and that inter-package ranges still resolve.
      - name: Verify
        run: deno task ok

      - name: Publish to JSR
        run: |
          set -euo pipefail
          for pkg in ${{ needs.targets.outputs.packages }}; do
            echo "::group::jsr publish $pkg"
            (cd "packages/$pkg" && deno publish)
            echo "::endgroup::"
          done

  npm:
    needs: [targets, jsr]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (and the provenance it generates)
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # trusted publishing needs Node >= 22.14
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, which is newer than the npm
      # bundled with any current Node release.
      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version

      # dnt transpiles the Deno sources into a dual ESM/CJS package, taking
      # name/license/description/exports and the workspace dependency ranges from
      # the package's own deno.json.
      - name: Build and publish to npm
        run: |
          set -euo pipefail
          for pkg in ${{ needs.targets.outputs.packages }}; do
            VERSION=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('packages/$pkg/deno.json')).version)")
            echo "::group::npm publish $pkg@$VERSION"
            (
              cd "packages/$pkg"
              deno run -A ../../scripts/build_npm.ts "$VERSION"
              cd npm
              # No token and no --provenance: trusted publishing authenticates over
              # OIDC and attaches a provenance attestation automatically.
              npm publish --access public
            )
            echo "::endgroup::"
          done
