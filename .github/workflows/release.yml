name: Release

# Publishes a workspace package to JSR and (if an npm token is configured) to npm.
#
# Two ways to trigger:
#   1. Push a tag `<package-dir>-v<version>`, e.g. `cubing-core-v0.1.0`. The tag's
#      version must match that package's deno.json, or the run fails before publishing.
#   2. Run manually from the Actions tab, choosing a package — or `all`, which
#      publishes every package in dependency order at whatever version its
#      deno.json declares. `all` is the one to use for a coordinated release.
#
# JSR authentication is OIDC: no token, but each package must be linked to this
# GitHub repository in its JSR settings first. npm authentication needs an
# `NPM_TOKEN` repository secret; without it the npm step is skipped, not failed.

on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        required: true
        type: choice
        default: all
        options: [all, cubing-core, algsets, apb]

permissions:
  contents: read
  id-token: write # JSR OIDC, and npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Work out which packages to publish, and in what order. Dependency order
      # matters: algsets and apb declare `jsr:@moishy/cubing-core@^x.y.z`, and JSR
      # rejects a package whose dependencies do not resolve.
      - name: Resolve targets
        id: targets
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.package }}" in
              all) PACKAGES="cubing-core algsets apb" ;;
              *)   PACKAGES="${{ inputs.package }}" ;;
            esac
          else
            TAG="${GITHUB_REF_NAME}"
            PACKAGES="${TAG%-v*}"          # cubing-core-v0.1.0 -> cubing-core
            TAG_VERSION="${TAG##*-v}"      # cubing-core-v0.1.0 -> 0.1.0
            echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
            if [ ! -d "packages/$PACKAGES" ]; then
              echo "::error::Tag '$TAG' does not name a package directory under packages/"
              exit 1
            fi
          fi
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "Publishing: $PACKAGES"

      # A tag that disagrees with the manifest would publish a version nobody
      # can find from the tag. Fail loudly instead.
      - name: Verify tag matches deno.json
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          PKG="${{ steps.targets.outputs.packages }}"
          MANIFEST=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('packages/$PKG/deno.json')).version)")
          if [ "$MANIFEST" != "${{ steps.targets.outputs.tag_version }}" ]; then
            echo "::error::Tag says ${{ steps.targets.outputs.tag_version }} but packages/$PKG/deno.json says $MANIFEST"
            exit 1
          fi

      # Never publish something that does not pass the gate. `deno task ok` also
      # runs the version-consistency test, which checks each package's exported
      # VERSION against its deno.json and that inter-package ranges still resolve.
      - name: Verify
        run: deno task ok

      - name: Publish to JSR
        run: |
          set -euo pipefail
          for pkg in ${{ steps.targets.outputs.packages }}; do
            echo "::group::jsr publish $pkg"
            (cd "packages/$pkg" && deno publish)
            echo "::endgroup::"
          done

      - name: Check for npm credentials
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not set — published to JSR only. Add the secret to enable npm."
          fi

      # dnt transpiles the Deno sources into a dual ESM/CJS npm package, taking
      # name/license/description from the package's own deno.json and the version
      # from the manifest.
      - name: Publish to npm
        if: steps.npm.outputs.configured == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in ${{ steps.targets.outputs.packages }}; do
            VERSION=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('packages/$pkg/deno.json')).version)")
            echo "::group::npm publish $pkg@$VERSION"
            (
              cd "packages/$pkg"
              deno run -A ../../scripts/build_npm.ts "$VERSION"
              cd npm
              npm publish --access public --provenance
            )
            echo "::endgroup::"
          done
